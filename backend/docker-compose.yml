services:
  postgres:
    image: postgres:16-alpine
    container_name: cefa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cefa
      POSTGRES_PASSWORD: cefa
      POSTGRES_DB: cefa
    ports:
      - "5432:5432"
    volumes:
      - cefa_pgdata:/var/lib/postgresql/data

volumes:
  cefa_pgdata:
